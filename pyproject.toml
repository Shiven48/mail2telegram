[project]
name = "telegram-categorizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shiven_Royal", email = "shevenroyal@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
telegram-categorizer = "telegram_categorizer:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
